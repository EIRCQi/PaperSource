<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文栖 PDF 阅读器</title><link rel="stylesheet" href="/pdf-assets/viewer.css"><link rel="stylesheet" href="/reader.css"><script type="module" src="/reader.js"></script></head>
<body>
<header>
  <button id="previous" disabled aria-label="上一页">上一页</button>
  <label>第 <input id="pageNumber" type="number" min="1" value="1" aria-label="页码" disabled> / <span id="pageTotal">—</span> 页</label>
  <button id="next" disabled aria-label="下一页">下一页</button>
  <select id="zoom" aria-label="缩放" disabled><option value="width">适应宽度</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select>
  <button id="fullscreen" type="button">全屏 PDF</button>
  <button id="excerpt" type="button" disabled title="先在 PDF 中选中文字，再追加到笔记">摘录到笔记</button>
</header>
<form id="pageSearch" role="search" aria-label="当前 PDF 页内查找">
  <input id="findQuery" type="search" maxlength="200" placeholder="查找当前页文字" aria-label="查找当前页文字" autocomplete="off">
  <button id="findPrevious" type="submit" disabled aria-label="上一个匹配">上一个</button>
  <button id="findNext" type="submit" disabled aria-label="下一个匹配">下一个</button>
  <button id="clearFind" type="button">清除</button><span id="findCount" role="status">等待本页载入</span>
</form>
<p id="status" role="status">正在载入阅读器…</p><p id="toolStatus" role="status" hidden></p>
<div id="viewport" tabindex="0" aria-label="PDF 页面"><div id="sheet"><div id="searchMarks" aria-hidden="true"></div></div></div>
<div id="error" role="alert" hidden></div><noscript>请启用 JavaScript，或通过“打开 PDF”阅读。</noscript>
</body></html>
